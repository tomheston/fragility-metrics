# Deploys web/ to fragilitymetrics.org whenever web/ changes on main.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER      the hosting server's hostname from cPanel, not
#                   fragilitymetrics.org (that name is behind Cloudflare,
#                   which does not pass FTP)
#   FTP_USERNAME    the cPanel FTP account
#   FTP_PASSWORD    its password
#   FTP_SERVER_DIR  the site's document root as that FTP account sees it,
#                   ending in "/" (for example public_html/)
#
# The action keeps a sync-state file on the server and only deletes files it
# uploaded earlier that have since been removed from web/. Server-only files
# (db_config.php, error_log, cache/) are excluded below, so they are never
# uploaded, overwritten, or deleted.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync web/ to the server over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./web/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/db_config.php
            **/error_log
            **/cache/**

      # Tells IndexNow-participating search engines (Bing, Yandex, and others;
      # not Google) that the site's pages changed, so they recrawl within
      # minutes instead of on their own schedule. The key is public by design:
      # ownership is proven by serving the matching key file at
      # https://fragilitymetrics.org/72965dc5b98bfc0d5025b00dae459257.txt
      # (web/72965dc5b98bfc0d5025b00dae459257.txt, uploaded by the sync above).
      # The site is small, so every deploy submits the full sitemap URL set.
      # A non-2xx response is reported but does not fail the deploy.
      - name: Ping IndexNow
        run: |
          http_code=$(curl -sS -o /tmp/indexnow_response.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data '{
              "host": "fragilitymetrics.org",
              "key": "72965dc5b98bfc0d5025b00dae459257",
              "keyLocation": "https://fragilitymetrics.org/72965dc5b98bfc0d5025b00dae459257.txt",
              "urlList": [
                "https://fragilitymetrics.org/",
                "https://fragilitymetrics.org/documentation.php",
                "https://fragilitymetrics.org/resources.php",
                "https://fragilitymetrics.org/faq.php",
                "https://fragilitymetrics.org/about.php",
                "https://fragilitymetrics.org/survival.php",
                "https://fragilitymetrics.org/global-fragility-index.php"
              ]
            }')
          echo "IndexNow HTTP $http_code"
          cat /tmp/indexnow_response.txt || true
          case "$http_code" in
            2*) echo "IndexNow accepted the submission." ;;
            *)  echo "::warning::IndexNow returned HTTP $http_code (deploy itself succeeded)." ;;
          esac
